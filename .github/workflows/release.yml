# Build the flash images and the disk images, and publish them.
#
# A push of a tag v* makes a GitHub release with the files.  A manual run
# (Actions > release > Run workflow) builds the same files and keeps them as
# workflow artifacts only.  Usual commits do not start a build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [esp32s31, coreboard1, korvo1]
    # Buildroot builds a toolchain, the kernel and the userspace: approximately
    # 2 to 3 hours on a hosted runner.  The limit for a job is 6 hours.
    timeout-minutes: 350
    steps:
      - name: Free disk space
        # Buildroot needs approximately 15 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the ESP-IDF version
        id: idf
        run: echo "commit=$(cat bootloader/esp-idf.version)" >> "$GITHUB_OUTPUT"

      - name: Cache ESP-IDF and its tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/esp/esp-idf
            ~/.espressif
          key: esp-idf-${{ steps.idf.outputs.commit }}

      - name: Install the host packages and ESP-IDF
        run: scripts/ci-setup.sh

      - name: Cache the Buildroot downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/br-dl
          key: br-dl-${{ matrix.board }}-${{ hashFiles(format('br2-external/configs/{0}_defconfig', matrix.board), '.gitmodules') }}
          restore-keys: br-dl-${{ matrix.board }}-

      - name: Build
        run: BOARD=${{ matrix.board }} scripts/ci-build.sh

      - name: Package
        run: |
          python=$(ls -d ~/.espressif/python_env/*/bin/python | tail -1)
          version=${GITHUB_REF_NAME}
          [ "$GITHUB_REF_TYPE" = tag ] || version=$(git describe --always --dirty)
          ESPTOOL="$python -m esptool" scripts/package-release.sh "$version" ${{ matrix.board }}
          rm build/release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32s31-linux-${{ matrix.board }}
          path: build/release/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Make the checksums
        run: cd release && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32s31-linux
          path: release/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'tag'
        with:
          path: src
          sparse-checkout: docs

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          body_path: src/docs/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
