%YAML 1.2
---
$id: http://devicetree.org/schemas/display/esp-mosaico,co5300-480x480.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP-Mosaico 480x480 CO5300 QSPI AMOLED panel

maintainers:
  - whatshu <shussm@qq.com>

description:
  The 480x480 RGB565 CO5300 panel fitted to ESP-Mosaico CoreBoard V1.2.
  Commands use a single data line and pixel writes use four data lines.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: esp-mosaico,co5300-480x480

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 40000000

  spi-tx-bus-width:
    items:
      - const: 4

  reset-gpios:
    maxItems: 1
    description: Active-low hardware reset

  vdd-supply:
    description: Shared 3.3 V peripheral power rail

required:
  - compatible
  - reg
  - spi-tx-bus-width
  - reset-gpios
  - vdd-supply

unevaluatedProperties: false
