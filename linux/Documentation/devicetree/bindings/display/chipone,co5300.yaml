%YAML 1.2
---
$id: http://devicetree.org/schemas/display/chipone,co5300.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chipone CO5300 QSPI AMOLED panel

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  Local binding for the CO5300 framebuffer console. Command headers and
  command parameters use one SPI lane. Pixel data uses four lanes.
  Panel geometry and vendor initialization must match the actual module.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: chipone,co5300

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 80000000

  spi-tx-bus-width:
    const: 4

  reset-gpios:
    maxItems: 1

  chipone,width:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Visible width in pixels.
    minimum: 1
    maximum: 512
    default: 466

  chipone,height:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Visible height in pixels.
    minimum: 1
    maximum: 512
    default: 466

  chipone,x-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: First visible column in controller RAM.
    maximum: 65534
    default: 6

  chipone,y-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: First visible row in controller RAM.
    maximum: 65534
    default: 0

  chipone,init-sequence:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 4096
    description: |
      Optional supplier initialization replacing the reference sequence.
      Each record contains command, payload length, delay in milliseconds
      as two bytes (MSB first), and payload. The driver validates record
      boundaries. MADCTL 0 and COLMOD 0x55 precede this sequence, and
      Display On (0x29) follows it. Include Sleep Out and its delay.
      Geometry plus offsets must fit in 16-bit column/row addresses.

required:
  - compatible
  - reg
  - spi-max-frequency
  - spi-tx-bus-width
  - reset-gpios

unevaluatedProperties: false
...
