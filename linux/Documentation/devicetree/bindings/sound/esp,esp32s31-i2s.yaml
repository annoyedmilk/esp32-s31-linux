%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/esp,esp32s31-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 standard I2S controller

maintainers:
  - whatshu <shussm@qq.com>

description: |
  Standard Philips I2S with two 16-bit slots. The controller supplies
  MCLK, BCLK and WS. Playback and capture share clock pads and run
  separately, using the default and capture pin states respectively.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: esp,esp32s31-i2s
  reg:
    maxItems: 1
  clocks:
    items:
      - description: APB register clock
      - description: Fractional master clock
  clock-names:
    items:
      - const: apb
      - const: mclk
  resets:
    maxItems: 1
  dmas:
    items:
      - description: Transmit channel
      - description: Receive channel
  dma-names:
    items:
      - const: tx
      - const: rx
  pinctrl-names:
    items:
      - const: default
      - const: capture
  pinctrl-0: true
  pinctrl-1: true
  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - dmas
  - dma-names
  - pinctrl-names
  - pinctrl-0
  - pinctrl-1
  - "#sound-dai-cells"

unevaluatedProperties: false
