%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/esp,esp32s31-rmt-ws2812.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 WS2812 RGB LED on the RMT

maintainers:
  - Marco Müller <hello@annoyedmilk.ch>

description: >
  One WS2812 RGB LED on RMT channel 0 of the ESP32-S31. The pin control
  state routes the channel 0 output to the LED pin.

properties:
  compatible:
    const: esp,esp32s31-rmt-ws2812

  reg:
    items:
      - description: RMT registers
      - description: HP_SYSTEM_RMT_MEM_LP_CTRL, the power control of the RMT RAM

  clocks:
    items:
      - description: RMT bus clock
      - description: RMT function clock

  clock-names:
    items:
      - const: sys
      - const: core

  resets:
    maxItems: 1

  led:
    type: object
    $ref: leds-class-multicolor.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - led

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/esp32s31-clk.h>
    #include <dt-bindings/leds/common.h>

    led-controller@20355000 {
        compatible = "esp,esp32s31-rmt-ws2812";
        reg = <0x20355000 0x1000>, <0x20586204 0x4>;
        clocks = <&hp_clkrst ESP32S31_CLK_RMT_SYS>,
                 <&hp_clkrst ESP32S31_CLK_RMT>;
        clock-names = "sys", "core";
        resets = <&hp_clkrst ESP32S31_RST_RMT>;

        led {
            color = <LED_COLOR_ID_RGB>;
            function = LED_FUNCTION_STATUS;
        };
    };
