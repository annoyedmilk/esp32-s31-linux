%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/esp,esp32s31-axi-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 AXI peripheral DMA

maintainers:
  - whatshu <shussm@qq.com>

description: |
  Three peripheral receive channels. The first DMA cell selects channel 0 to
  2; the second selects the peripheral request (0 CAM, 1 GPSPI2, 2 GPSPI3,
  3 I3C, 4 UHCI0, 5 UHCI1). This driver supports device-to-memory transfers.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    const: esp,esp32s31-axi-dma
  reg:
    maxItems: 1
  interrupts:
    minItems: 3
    maxItems: 3
  clocks:
    maxItems: 1
  resets:
    maxItems: 1
  "#dma-cells":
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - "#dma-cells"

additionalProperties: false
