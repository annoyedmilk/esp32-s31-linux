%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/esp,esp32s31-ahb-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 AHB peripheral DMA

maintainers:
  - whatshu <shussm@qq.com>

description: |
  Five receive and five transmit channels. The first DMA cell selects
  receive channel 0 to 4 or transmit channel 5 to 9. The second selects
  the peripheral request, with 1 selecting I2S0. Request 9 is reserved.
  Audio uses a cyclic ring of descriptors and coherent PCM buffers.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    const: esp,esp32s31-ahb-dma
  reg:
    maxItems: 1
  interrupts:
    minItems: 10
    maxItems: 10
    description: Receive channels 0 to 4, then transmit channels 0 to 4.
  clocks:
    maxItems: 1
  resets:
    maxItems: 1
  "#dma-cells":
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - "#dma-cells"

additionalProperties: false
