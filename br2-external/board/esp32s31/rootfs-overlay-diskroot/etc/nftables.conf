#!/usr/sbin/nft -f
# SPDX-License-Identifier: MIT
# S35nftables loads this file at boot.  Inbound: ping, DHCP, mDNS, SSH and
# the Thread mesh (wpan0, link-secured with the network key); all other new
# connections are dropped and logged (dmesg, "nft drop").  The Thread
# border router forwards between wpan0 and the backbone.
# To open a port, add a line below "tcp dport 22 accept" and run
# /etc/init.d/S35nftables start.  NAT: the README.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		iifname "wpan0" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport { 67, 68, 5353 } accept
		tcp dport 22 accept
		limit rate 2/second log prefix "nft drop: "
		counter
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		iifname "wpan0" accept
		oifname "wpan0" accept
		ct state established,related accept
	}
}
