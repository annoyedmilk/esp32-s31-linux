#!/usr/sbin/nft -f
# SPDX-License-Identifier: MIT
# S35nftables loads this file at boot.  Inbound: ping, DHCP, mDNS, SSH and
# on the disk boards the Thread mesh (wpan0, link-secured with the network
# key) and the border agent of ot-daemon for commissioners (UDP 49191, and
# 49192 for the ephemeral key of thread-share; DTLS with the PSKc or the
# key).  In the relay mode of thread-start, the hosts in RELAY_ALLOW of
# /etc/default/thread on TCP 6638: thread-start fills the thread_relay
# sets, so after a reload of this file run thread-start stop and
# thread-start.  The Bluetooth proxy of ble-ha for the hosts in
# BT_PROXY_ALLOW of /etc/default/ble-ha on TCP 6053: after a reload, run
# /etc/init.d/S45ble-ha restart.  Other broadcast and multicast is dropped silently, all
# other new connections are dropped and logged (dmesg only, "nft drop").
# The Thread border router forwards between wpan0 and the backbone.
# To open a port, add a line below "tcp dport 22 accept" and run
# /etc/init.d/S35nftables start.  NAT: the README.

flush ruleset

table inet filter {
	set thread_relay4 { type ipv4_addr; }
	set thread_relay6 { type ipv6_addr; }
	set ble_ha4 { type ipv4_addr; }
	set ble_ha6 { type ipv6_addr; }

	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		iifname "wpan0" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport { 67, 68, 5353, 49191, 49192 } accept
		tcp dport 22 accept
		tcp dport 6638 ip saddr @thread_relay4 accept
		tcp dport 6638 ip6 saddr @thread_relay6 accept
		tcp dport 6053 ip saddr @ble_ha4 accept
		tcp dport 6053 ip6 saddr @ble_ha6 accept
		meta pkttype { broadcast, multicast } counter drop
		limit rate 2/second log prefix "nft drop: " level info
		counter
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		iifname "wpan0" accept
		oifname "wpan0" accept
		ct state established,related accept
	}
}

# NAT64 of ot-daemon: Thread devices reach IPv4 hosts from 192.168.255.0/24
# on wpan0, and the backbone sees the address of the board.
table ip thread-nat64 {
	chain postrouting {
		type nat hook postrouting priority srcnat;
		ip saddr 192.168.255.0/24 oifname != "wpan0" masquerade
	}
}
