#!/usr/sbin/nft -f
# SPDX-License-Identifier: MIT
# S35nftables loads this file at boot.  To open a port, add a line below
# "tcp dport 22 accept" and run /etc/init.d/S35nftables start.  A reload
# empties the sets: then run thread-start stop and thread-start,
# /etc/init.d/S45ble-ha restart, /etc/init.d/S42wireguard restart, and
# ap.sh again.

flush ruleset

table inet filter {
	set thread_relay4 { type ipv4_addr; }
	set thread_relay6 { type ipv6_addr; }
	set ble_ha4 { type ipv4_addr; }
	set ble_ha6 { type ipv6_addr; }
	set ap_dhcp { type ifname; }
	set ap_route { type ifname . ifname; }
	set wg_port { type inet_service; }

	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		# The Thread mesh: the network key secures its links.
		iifname "wpan0" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		# DHCP replies, mDNS, the border agent and the key of thread-share (DTLS).
		udp dport { 68, 5353, 49191, 49192 } accept
		# DHCP requests on the access point: ap.sh fills ap_dhcp.
		udp dport 67 iifname @ap_dhcp accept
		# The ListenPort of WireGuard while S42wireguard has wg0 up.
		udp dport @wg_port accept
		tcp dport 22 accept
		# thread-relay for RELAY_ALLOW: thread-start fills the sets.
		tcp dport 6638 ip saddr @thread_relay4 accept
		tcp dport 6638 ip6 saddr @thread_relay6 accept
		# The Bluetooth proxy for BT_PROXY_ALLOW: S45ble-ha fills the sets.
		tcp dport 6053 ip saddr @ble_ha4 accept
		tcp dport 6053 ip6 saddr @ble_ha6 accept
		meta pkttype { broadcast, multicast } counter drop
		# Other new connections: dropped and logged to dmesg ("nft drop").
		limit rate 2/second log prefix "nft drop: " level info
		counter
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		# The Thread border router, and the pairs of ap.sh --nat.
		iifname "wpan0" accept
		oifname "wpan0" accept
		iifname . oifname @ap_route accept
		ct state established,related accept
	}
}

# NAT64 of ot-daemon: Thread devices reach IPv4 hosts from 192.168.255.0/24
# on wpan0, and the backbone sees the address of the board.
table ip thread-nat64 {
	chain postrouting {
		type nat hook postrouting priority srcnat;
		ip saddr 192.168.255.0/24 oifname != "wpan0" masquerade
	}
}
