# The kernel computes a smaller default reserve from the RAM size.  When
# reclaim swaps a page to zram, zram needs free pages for it, and with that
# small reserve the write can fail ("Write-error on swap-device").  A larger
# reserve comes from the page cache, so programs start more slowly and more
# pages are read again from the root.
vm.min_free_kbytes = 512
