# The kernel default keeps approximately 450 KiB free on these boards.  When
# reclaim swaps a page to zram, zram needs free pages for it, and with that
# small reserve the write can fail ("Write-error on swap-device").  The
# reserve comes from the page cache: with 1024 KiB, the two boards started
# programs more slowly and read more pages again from the root.
vm.min_free_kbytes = 512
