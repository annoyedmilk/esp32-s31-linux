# wpa_supplicant configuration for wlan0.  Add a network:
#   wpa_passphrase "<ssid>" "<passphrase>" >> /etc/wpa_supplicant.conf
# For WPA3 or WPA2/WPA3 networks, the network block also needs
#   key_mgmt=WPA-PSK SAE
#   ieee80211w=1
# and the passphrase as psk="...", not the hex PSK.
ctrl_interface=/var/run/wpa_supplicant
update_config=1
