# wpa_supplicant configuration for wlan0.  Add a network:
#   wpa_passphrase "<ssid>" "<passphrase>" >> /etc/wpa_supplicant.conf
# For WPA3 or WPA2/WPA3 networks, the network block also needs
# key_mgmt=WPA-PSK SAE and the passphrase as psk="...", not the hex PSK.
# For WPA3 only, use key_mgmt=SAE with ieee80211w=2.
ctrl_interface=/var/run/wpa_supplicant
update_config=1
# Protected management frames when the access point offers them.  Without
# them, a WPA2/WPA3 router gave less than half of the TX throughput.
pmf=1
