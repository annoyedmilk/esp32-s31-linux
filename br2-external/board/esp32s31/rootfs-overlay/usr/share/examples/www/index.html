<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ESP32-S31 GPIO</title></head>
<body>
<h1>GPIO</h1>
<p>Set the pin number in the field. The pin must be free on your board.</p>
<p>This page has no password: each host that can open it can set the
pins. Use it only on a network that you trust.</p>
<input id="pin" type="number" min="0" max="61" value="2">
<button onclick="go('=1')">On</button>
<button onclick="go('=0')">Off</button>
<button onclick="go('')">Read</button>
<pre id="out"></pre>
<script>
function go(v) {
	fetch('/cgi-bin/gpio?' + document.getElementById('pin').value + v)
		.then(r => r.text()).then(t => document.getElementById('out').textContent = t);
}
</script>
</body></html>
