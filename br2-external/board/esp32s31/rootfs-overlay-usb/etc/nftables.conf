#!/usr/sbin/nft -f
# SPDX-License-Identifier: MIT
# The firewall.  S35nftables loads this file at boot.  Inbound, the board
# answers ping, DHCP and mDNS, and takes SSH; it drops all other new
# connections and logs them (dmesg, "nft drop").  To open a port now:
#   nft add rule inet filter input tcp dport 8080 accept
# To keep it, add the line below "tcp dport 22 accept" and run
# /etc/init.d/S35nftables start.  Without this file, there is no firewall.
#
# A router between an access point and Ethernet also needs
#   sysctl -w net.ipv4.ip_forward=1
#   nft add table ip nat
#   nft 'add chain ip nat postrouting { type nat hook postrouting priority srcnat; }'
#   nft add rule ip nat postrouting oifname eth0 masquerade
# and a forward rule from the access point interface to eth0.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport { 67, 68, 5353 } accept
		tcp dport 22 accept
		limit rate 2/second log prefix "nft drop: "
		counter
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
	}
}
