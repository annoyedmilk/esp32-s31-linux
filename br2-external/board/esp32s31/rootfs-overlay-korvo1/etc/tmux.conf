# The desktop on the panel.  The status bar shows Wi-Fi, Bluetooth, the free
# memory and the clock.  A smaller history keeps RAM free.
set -g default-terminal screen
set -g escape-time 10
set -g history-limit 1000
set -g status-interval 15
set -g status-right-length 60
set -g status-right '#(desk-status) %H:%M'
