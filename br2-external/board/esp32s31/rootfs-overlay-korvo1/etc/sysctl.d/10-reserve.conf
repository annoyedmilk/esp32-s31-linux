# The kernel default keeps approximately 420 KiB free on this board.  When
# reclaim swaps a page to zram, zram needs free pages for it, and with that
# small reserve the write can fail ("Write-error on swap-device").  The
# Korvo-1 has less RAM for Linux than the module alone, and the reserve
# comes from the page cache: with 1024 KiB, the boot was slower and more
# pages came again from the card.  512 KiB still keeps the zram writes safe.
vm.min_free_kbytes = 512
