<!DOCTYPE html>
<title>ESP32-S31 Linux</title>
<h1>ESP32-S31 Linux</h1>
<p>RGB LED:
<button onclick="led('255,0,0')">red</button>
<button onclick="led('0,255,0')">green</button>
<button onclick="led('0,0,255')">blue</button>
<button onclick="led('0,0,0')">off</button>
<pre id="out"></pre>
<script>
function led(rgb) {
	fetch('/cgi-bin/led?' + rgb)
		.then(r => r.text()).then(t => document.getElementById('out').textContent = t);
}
</script>
