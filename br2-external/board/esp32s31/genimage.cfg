# Provisioning image for a fresh card.  MBR is not a preference: the kernel has
# CONFIG_MSDOS_PARTITION and no GPT, so a GPT card shows no partitions at all.
# Rebuilds write rootfs.ext2 onto p2 instead of re-imaging the whole card.

image boot.vfat {
	vfat {
		label = "KORVO_SD"
		# mcopy cannot populate an empty filesystem, and genimage hands it
		# an empty rootpath, so the partition ships with its own note.
		file README.txt {
			image = "sd-readme.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	# 4M alignment: SD cards erase in blocks that size, and a partition landing
	# mid-block turns every write into read-modify-write.
	hdimage {
		align = 4M
	}

	partition data {
		partition-type = 0xc
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
