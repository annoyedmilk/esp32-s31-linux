# Image for a new card: p1 is FAT, p2 is the ext4 root.  MBR, because macOS
# diskutil and "make sdpart" also write MBR.  "make sdroot" writes only p2.

image boot.vfat {
	vfat {
		label = "KORVO_SD"
		# mcopy cannot populate an empty filesystem, and genimage hands it
		# an empty rootpath, so the partition ships with its own note.
		file README.txt {
			image = "sd-readme.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	# 4M alignment: SD cards erase in blocks that size, and a partition landing
	# mid-block turns every write into read-modify-write.
	hdimage {
		align = 4M
	}

	partition data {
		partition-type = 0xc
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
