# Image for a new disk (card or USB stick): p1 is FAT, p2 is the ext4
# root, p3 is swap.  MBR, because macOS diskutil and "make sdpart" also
# write MBR.  "make sdroot" writes only p2.

image boot.vfat {
	vfat {
		label = "ESP32S31"
		# mcopy cannot fill an empty filesystem: give it a README.
		file README.txt {
			image = "sd-readme.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	# SD cards erase 4M blocks: a misaligned write is a read-modify-write.
	hdimage {
		align = 4M
		# The Function-CoreBoard-1 root is PARTUUID=45533331-02.
		disk-signature = 0x45533331
		# Swap has no image: without fill, the file ends before it.
		fill = true
	}

	partition data {
		partition-type = 0xc
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}

	# S05swap.sh formats it at each boot.
	partition swap {
		partition-type = 0x82
		size = 64M
	}
}
