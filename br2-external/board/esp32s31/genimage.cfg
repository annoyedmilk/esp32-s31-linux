# Image for a new card: p1 is FAT, p2 is the ext4 root.  MBR, because macOS
# diskutil and "make sdpart" also write MBR.  "make sdroot" writes only p2.

image boot.vfat {
	vfat {
		label = "KORVO_SD"
		# mcopy cannot fill an empty filesystem, and genimage gives it an
		# empty rootpath.  Thus the partition gets a README file.
		file README.txt {
			image = "sd-readme.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	# 4M alignment: SD cards erase 4M blocks.  If a partition starts inside a
	# block, each write becomes a read-modify-write.
	hdimage {
		align = 4M
	}

	partition data {
		partition-type = 0xc
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
