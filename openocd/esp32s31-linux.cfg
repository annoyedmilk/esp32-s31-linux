# Linux currently boots the ESP32-S31 in unicore mode.  Tell the vendor target
# script not to examine CPU1: examining it releases that hart from reset, and
# its expected PMP fault joins the hardware halt group and stops CPU0 as well.
set _ONLYCPU 0x1

# Use the ESP32-S31 built-in USB-JTAG adapter and target definitions.
source [find board/esp32s31-builtin.cfg]

# The vendor ESP32-S31 target exposes only the common machine CSRs.  Linux
# runs in S-mode and its CLIC state is otherwise invisible to GDB, so publish
# the supervisor trap registers and the CLIC interrupt-status CSR explicitly.
foreach tgt [target names] {
	$tgt riscv expose_csrs 256=sstatus
	$tgt riscv expose_csrs 261=stvec
	$tgt riscv expose_csrs 320=sscratch
	$tgt riscv expose_csrs 321=sepc
	$tgt riscv expose_csrs 322=scause
	$tgt riscv expose_csrs 323=stval
	$tgt riscv expose_csrs 327=sintthresh
	$tgt riscv expose_csrs 4017=mintstatus
}

# Linux executes from PSRAM and is not an ESP-IDF flash image.  Do not run the
# ESP flash stub when GDB attaches; it uses the target work area and times out
# once the hart has entered Linux S-mode.
gdb memory_map disable
gdb flash_program disable
