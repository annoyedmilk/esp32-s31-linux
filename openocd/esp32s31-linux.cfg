# The SMP target shows the two harts as threads; a halt stops both.
# Connect after the boot: an early examine of hart 1 releases it from reset.

# No flash bank: with one, OpenOCD resets the chip at the GDB attach (PMP, APM).
set ESP_FLASH_SIZE 0

source [find board/esp32s31-builtin.cfg]

# No flash stub at the GDB connect: it times out when hart 1 runs Linux.
gdb memory_map disable
gdb flash_program disable
