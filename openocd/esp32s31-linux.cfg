# Examine only CPU0.  When OpenOCD examines CPU1 before the loader starts
# it, CPU1 leaves reset and faults.  The fault goes through the halt group
# and stops CPU0 too.  Linux runs on CPU1, so GDB cannot see the kernel.
set _ONLYCPU 0x1

# Use the ESP32-S31 USB-JTAG adapter and target definitions.
source [find board/esp32s31-builtin.cfg]

# The vendor target shows only the common machine CSRs.  Linux runs in
# S-mode, and GDB cannot see its CLIC state.  Thus show the supervisor trap
# registers and the CLIC interrupt-status CSR.
foreach tgt [target names] {
	$tgt riscv expose_csrs 256=sstatus
	$tgt riscv expose_csrs 261=stvec
	$tgt riscv expose_csrs 320=sscratch
	$tgt riscv expose_csrs 321=sepc
	$tgt riscv expose_csrs 322=scause
	$tgt riscv expose_csrs 323=stval
	$tgt riscv expose_csrs 327=sintthresh
	$tgt riscv expose_csrs 4017=mintstatus
}

# Linux executes from PSRAM and is not an ESP-IDF flash image.  Do not run
# the ESP flash stub when GDB connects.  The stub uses the target work area
# and times out after the hart is in Linux S-mode.
gdb memory_map disable
gdb flash_program disable
